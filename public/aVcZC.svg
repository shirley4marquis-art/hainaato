<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="NINDGE AUTO 宁吉国际">
  <defs>
    <style>
      .ring-outer { fill: #0B2A5B; }
      .ring-inner { fill: none; stroke: #F97316; stroke-width: 10; }
      .ring-mid { fill: none; stroke: #F97316; stroke-width: 6; }
      .word-nindge { font-family: Arial Black, Impact, Haettenschweiler, sans-serif; font-weight: 900; font-style: italic; font-size: 148px; fill: #FFFFFF; stroke: #F97316; stroke-width: 6; paint-order: stroke fill; letter-spacing: -4px; }
      .word-auto { font-family: Arial Black, Impact, sans-serif; font-weight: 900; font-style: italic; font-size: 78px; fill: #F97316; letter-spacing: 4px; }
      .word-cn { font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", SimHei, sans-serif; font-weight: 800; font-size: 92px; fill: #FFFFFF; stroke: #F97316; stroke-width: 3; paint-order: stroke fill; }
      .word-sub { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 36px; fill: #FFFFFF; letter-spacing: 6px; }
      .rule { stroke: #F97316; stroke-width: 8; stroke-linecap: square; }
    </style>
  </defs>

  <!-- Transparent outside the circle; badge fill is navy -->
  <circle cx="500" cy="500" r="478" class="ring-outer"/>
  <circle cx="500" cy="500" r="458" class="ring-inner"/>
  <circle cx="500" cy="500" r="438" class="ring-mid"/>

  <!-- ® -->
  <text x="790" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">®</text>
  <circle cx="790" cy="306" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- NINDGE -->
  <text class="word-nindge" x="500" y="430" text-anchor="middle">NINDGE</text>

  <!-- AUTO with rules -->
  <line class="rule" x1="175" y1="478" x2="355" y2="478"/>
  <line class="rule" x1="645" y1="478" x2="825" y2="478"/>
  <text class="word-auto" x="500" y="508" text-anchor="middle">AUTO</text>

  <!-- Chinese -->
  <text class="word-cn" x="500" y="620" text-anchor="middle">宁吉国际</text>

  <!-- Subline -->
  <text class="word-sub" x="500" y="690" text-anchor="middle">CHINA AUTO EXPORT</text>

  <!-- Bottom arc -->
  <path id="arcBottom" d="M 220,760 A 300,300 0 0 0 780,760" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="10">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">NINDGE AUTO</textPath>
  </text>
</svg>
